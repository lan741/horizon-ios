[package]
name = "horizon-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The iOS app entry: the game runs in the app's own process, with the folders UIKit hands it (docs/ios.md)"

# A static library the Xcode app links; `ios/main.m` calls `horizon_ios_run`.
[lib]
name = "horizon_ios"
crate-type = ["staticlib"]

[dependencies]
horizon-client = { path = "../horizon-client", default-features = false }
horizon-mod-package = { path = "../horizon-mod-package", default-features = false, features = ["index"] }
# What `horizon-mod-host::main_with` installs before the engine starts, without its code
# loading: the slot provider, the mod instrumentation, the platform half and the render
# points (docs/ios.md).
horizon-engine-slots = { path = "../horizon-engine-slots" }
mod_points = { package = "horizon-mod-points", path = "../horizon-mod-points" }
mod_render = { package = "horizon-mod-render", path = "../horizon-mod-render" }
# The API and the instrumentation `main_with` installs; the crate's lib is `mod_api`.
mod_api = { package = "horizon-mod-api", path = "../horizon-mod-api" }
log = "0.4"

# The launch log's signal handler: `libc::write` is the only async-signal-safe call there.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"

[lints]
workspace = true