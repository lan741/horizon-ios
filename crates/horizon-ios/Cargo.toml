[package]
name = "horizon-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The iOS app entry: the game runs in the app's own process, with the folders UIKit hands it (docs/ios.md)"

# A static library the Xcode app links; `ios/main.m` calls `horizon_ios_run`.
[lib]
name = "horizon_ios"
crate-type = ["staticlib"]

[dependencies]
horizon-client = { path = "../horizon-client", default-features = false }
horizon-mod-package = { path = "../horizon-mod-package", default-features = false, features = ["index"] }
# `PackageInfo`, the type `entry::CodeRuntime` hands a code runtime; the crate's lib is
# named `mod_vocab`.
mod_vocab = { package = "horizon-mod-vocab", path = "../horizon-mod-vocab", default-features = false }
log = "0.4"

[lints]
workspace = true