name: CI

on:
  push:
    # horizonpad-engine is the integration branch this project is developed on;
    # listing it here means a push there runs CI without touching the default
    # branch (workflow_dispatch can only target workflows on the default branch).
    branches: [main, horizonpad-engine]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Cheapest possible gate: does a fresh checkout have everything the other
  # jobs need, and does it avoid absolute paths that only exist on one machine?
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/preflight.py

  # ---------------------------------------------------------------------------
  # Engine: every host that has a Rust toolchain. This is where the bulk of the
  # tests live, so it runs on three operating systems.
  # ---------------------------------------------------------------------------
  engine:
    name: Engine (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path engine/Cargo.toml -- --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path engine/Cargo.toml

      - name: Build CLI and self-test
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path engine/Cargo.toml -p hz-cli
          ./engine/target/release/hz selftest

      # The Vorbis decoder is a vendored C file compiled by build.rs; this proves
      # the compiler was found and the samples came out sane.
      - name: Decode the Vorbis fixture
        shell: bash
        run: |
          set -euo pipefail
          out=$(./engine/target/release/hz sound-check engine/tests/data/tiny.ogg)
          echo "$out"
          echo "$out" | grep -q 'decoded:'
          echo "$out" | grep -q 'checksums_ok=true'

      - name: Translate the shader fixture
        shell: bash
        run: |
          set -euo pipefail
          ./engine/target/release/hz shader-translate \
            engine/tests/data/shader_pack.zip "$RUNNER_TEMP/terrain.metal"
          grep -q 'hz_vertex' "$RUNNER_TEMP/terrain.metal"
          grep -q 'hz_fragment' "$RUNNER_TEMP/terrain.metal"

  # ---------------------------------------------------------------------------
  # Round-trip against an unrelated ZIP writer, on Windows only: it builds a
  # jar with PowerShell's own archiver and checks our inflate against it.
  # ---------------------------------------------------------------------------
  roundtrip:
    name: Round-trip against PowerShell's ZIP writer
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI
        run: cargo build --release --manifest-path engine/Cargo.toml -p hz-cli
      - name: Verify pipeline
        run: pwsh -File scripts/verify-pipeline.ps1

  # ---------------------------------------------------------------------------
  # Swift structure checks: cheap, no toolchain needed.
  # ---------------------------------------------------------------------------
  swift-structure:
    name: Swift structural checks
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/swift_check.py
      # Catches a name used as `foo(...)` that no file declares.
      - run: python3 scripts/swift_refs.py
      # The download chain: the catalog's own assertions (skipped without a Swift
      # toolchain) plus the stronger claim that the zip it writes is a container
      # the engine ports.
      - name: Build the CLI
        run: cargo build --release --manifest-path engine/Cargo.toml -p hz-cli
      - name: Verify the download chain
        run: python3 scripts/verify-download-chain.py

  # ---------------------------------------------------------------------------
  # The real thing: cross-compile the engine for iOS, generate the Xcode
  # project, build the app for the simulator, run its tests, and compile the
  # generated Metal source. No Apple developer account is needed because nothing
  # is signed.
  # ---------------------------------------------------------------------------
  ios:
    name: iOS build (simulator, unsigned)
    needs: preflight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build the Rust static libraries
        run: bash scripts/build-ios.sh

      - name: Swift compile checks
        run: bash scripts/swift_typecheck.sh

      # Interrupt a transfer against a local range-capable server and check it
      # resumes instead of restarting. Runs here because this image has a Swift
      # toolchain; the script exits 2 (skip) if there is none.
      - name: Verify resume behaviour
        run: python3 scripts/test-resume.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: cd app && xcodegen generate

      # This runner image ships Xcode and the iOS SDK but no iOS *simulator
      # runtime* (only visionOS ones), so any concrete simulator destination
      # fails with "Unable to find a destination". A generic destination compiles
      # the app and the test bundle without needing a runtime — which is exactly
      # what CI has to prove. Running the tests needs a runtime; that is detected
      # and skipped rather than failed.
      - name: Report the toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "installed runtimes:"
          xcrun simctl list runtimes | sed -n '1,10p'

      - name: Build for the simulator SDK
        run: |
          set -euo pipefail
          xcodebuild build \
            -project app/HorizonPad.xcodeproj \
            -scheme HorizonPad \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/build.log"
          tail -n 30 "$RUNNER_TEMP/build.log"

      - name: Build the app and its tests for iOS
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project app/HorizonPad.xcodeproj \
            -scheme HorizonPad \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-tests" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/tests.log"
          tail -n 30 "$RUNNER_TEMP/tests.log"

      # simctl and xcodebuild disagree on this image: simctl lists an iPhone in an
      # iOS runtime, while Xcode's own destination list contains none (only
      # visionOS plus the "My Mac" placeholder it then refuses). Ask Xcode, since
      # that is the thing that has to accept the destination.
      - name: Run the tests if Xcode offers a simulator
        run: |
          set -euo pipefail
          DESTS=$(xcodebuild -project app/HorizonPad.xcodeproj -scheme HorizonPad \
                    -showdestinations 2>/dev/null || true)
          UDID=$(printf '%s\n' "$DESTS" \
                 | grep 'platform:iOS Simulator' \
                 | grep -o 'id:[0-9A-Fa-f-]\{8,\}' \
                 | head -n 1 | cut -d: -f2 || true)
          if [ -z "${UDID:-}" ]; then
            echo "Xcode offers no iOS simulator destination on this image"
            echo "the app and its test bundle were compiled; running them needs a runtime"
            exit 0
          fi
          xcodebuild test \
            -project app/HorizonPad.xcodeproj \
            -scheme HorizonPad \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd-tests" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO

      # The two things only a real Metal compiler can prove.
      - name: Compile the generated Metal source
        run: |
          set -euo pipefail
          # The CLI is a host binary; this job only built the static library above.
          cargo build --release --manifest-path engine/Cargo.toml -p hz-cli
          ./engine/target/release/hz shader-translate \
            engine/tests/data/shader_pack.zip "$RUNNER_TEMP/terrain.metal"
          # Device SDK is always installed; the simulator SDK only on images that
          # also carry a runtime.
          xcrun -sdk iphoneos metal -c "$RUNNER_TEMP/terrain.metal" -o "$RUNNER_TEMP/terrain-device.air"
          if xcrun --sdk iphonesimulator --show-sdk-path >/dev/null 2>&1; then
            xcrun -sdk iphonesimulator metal -c "$RUNNER_TEMP/terrain.metal" -o "$RUNNER_TEMP/terrain-sim.air"
            echo "generated MSL compiles for the device and the simulator"
          else
            echo "generated MSL compiles for the device"
          fi

      - name: Package the simulator app
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/dd" "$RUNNER_TEMP/dd-tests" -name 'HorizonPad.app' -type d 2>/dev/null | head -n 1)
          if [ -z "${APP:-}" ]; then
            echo "HorizonPad.app not found" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/HorizonPad-simulator.zip"
          ls -lh "$RUNNER_TEMP/HorizonPad-simulator.zip"

      - name: Upload the simulator build
        uses: actions/upload-artifact@v4
        with:
          name: HorizonPad-simulator
          path: ${{ runner.temp }}/HorizonPad-simulator.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the Rust libraries
        uses: actions/upload-artifact@v4
        with:
          name: hz-ffi-libraries
          path: |
            engine/target/ios/libhz_ffi.a
            engine/target/ios-sim/libhz_ffi.a
          if-no-files-found: error
          retention-days: 14